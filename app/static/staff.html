<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoanSaathi Staff</title><style>body{font:15px/1.5 system-ui;background:#f3f6fa;color:#172b4d;margin:0}header{background:#102a43;color:white;padding:20px 5%;display:flex;justify-content:space-between}main{max-width:1150px;margin:24px auto;padding:0 16px}.bar{display:flex;gap:10px;flex-wrap:wrap}button,input,select{font:inherit;padding:9px;border-radius:8px;border:1px solid #cbd5e1}button{background:#2563eb;color:white;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;margin-top:16px}.card{background:white;border:1px solid #d9e2ec;border-radius:12px;padding:16px;overflow-wrap:anywhere}.muted{color:#62748a;font-size:.88rem}a{color:white}</style></head><body><header><b>LoanSaathi AI · Staff dashboard</b><a href="/">Borrower app →</a></header><main><h1>Enquiry queue</h1><p class="muted">Demo only; authentication/RBAC is not enabled. Do not expose publicly.</p><div class="bar"><button id="refresh">Refresh queue</button><button id="audit">Show recent audit events</button><span id="count"></span></div><div id="items" class="grid"></div><pre id="auditbox" style="white-space:pre-wrap;background:white;padding:12px;display:none"></pre></main><script>
async function refresh(){let xs=await(await fetch("/api/staff/enquiries")).json();document.querySelector("#count").textContent=xs.length+" enquiries";let root=document.querySelector("#items");root.innerHTML="";if(!xs.length){root.textContent="No enquiries yet. Use Talk to a person or ask an unsupported question in the borrower app.";return}xs.forEach(x=>{let c=document.createElement("section");c.className="card";let h=document.createElement("h3");h.textContent=x.intent+" · "+x.status;let p=document.createElement("p");p.textContent=x.summary;let m=document.createElement("div");m.className="muted";m.textContent="Created "+new Date(x.created_at).toLocaleString()+" · SLA target "+x.sla_minutes+" min";let s=document.createElement("select");["open","assigned","escalated","resolved"].forEach(v=>{let o=document.createElement("option");o.value=v;o.textContent=v;o.selected=v===x.status;s.appendChild(o)});let a=document.createElement("input");a.placeholder="Assigned staff";a.value=x.assigned_to||"";let f=document.createElement("input");f.placeholder="Feedback label";f.value=x.feedback_label||"";let b=document.createElement("button");b.textContent="Save update";b.onclick=async()=>{await fetch("/api/staff/enquiries/"+x.id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:s.value,assigned_to:a.value,feedback_label:f.value})});refresh()};c.append(h,p,m,s,a,f,b);root.appendChild(c)})}
document.querySelector("#refresh").onclick=refresh;document.querySelector("#audit").onclick=async()=>{let d=await(await fetch("/api/staff/audit")).json(),b=document.querySelector("#auditbox");b.style.display="block";b.textContent=JSON.stringify(d,null,2)};refresh();
</script></body></html>
